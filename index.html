<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>財務分析儀表板</title>
<style>
  :root{
    --bg:#0d1117;
    --sidebar:#12161f;
    --border:#232a38;
    --text:#e6edf3;
    --muted:#8b96a8;
    --accent:#5b9dff;
    --accent-2:#c084fc;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Segoe UI",sans-serif;
    background:var(--bg);color:var(--text);
    display:flex;overflow:hidden;
  }

  /* ---------- 左側選單 ---------- */
  #sidebar{
    width:250px;flex:0 0 250px;height:100vh;
    background:var(--sidebar);border-right:1px solid var(--border);
    display:flex;flex-direction:column;
  }
  .brand{padding:22px 20px 16px;border-bottom:1px solid var(--border)}
  .brand h1{font-size:16px;font-weight:600;letter-spacing:.5px}
  .brand p{font-size:11px;color:var(--muted);margin-top:5px}

  nav{padding:14px 10px;flex:1;overflow-y:auto}
  .nav-label{font-size:10px;color:var(--muted);letter-spacing:1.5px;padding:8px 10px 6px}
  .nav-item{
    display:block;width:100%;text-align:left;cursor:pointer;
    background:transparent;border:0;color:var(--muted);
    font-family:inherit;font-size:13.5px;line-height:1.5;
    padding:11px 12px;margin-bottom:4px;border-radius:8px;
    border-left:3px solid transparent;transition:.15s;
  }
  .nav-item:hover{background:#1a2130;color:var(--text)}
  .nav-item.active{background:#1c2434;color:#fff;border-left-color:var(--accent)}
  .nav-item.active[data-theme="purple"]{border-left-color:var(--accent-2)}
  .nav-item small{display:block;font-size:10.5px;color:var(--muted);margin-top:3px;font-weight:400}
  .nav-item.active small{color:#9fb0c8}

  .side-foot{padding:14px 20px;border-top:1px solid var(--border);font-size:10.5px;color:var(--muted);line-height:1.7}
  .side-foot a{color:var(--accent);text-decoration:none}

  /* ---------- 右側內容 ---------- */
  #main{flex:1;display:flex;flex-direction:column;min-width:0}
  #topbar{
    height:46px;flex:0 0 46px;display:flex;align-items:center;justify-content:space-between;
    padding:0 18px;border-bottom:1px solid var(--border);background:var(--sidebar);
  }
  #crumb{font-size:12.5px;color:var(--muted)}
  #crumb b{color:var(--text);font-weight:600}
  #newtab{font-size:11.5px;color:var(--accent);text-decoration:none;border:1px solid var(--border);
          padding:5px 11px;border-radius:6px;transition:.15s}
  #newtab:hover{background:#1a2130}
  #frame{flex:1;width:100%;border:0;background:var(--bg)}

  /* ---------- 手機版：選單收到上方 ---------- */
  #burger{display:none}
  @media(max-width:820px){
    body{flex-direction:column;overflow:auto}
    #sidebar{width:100%;flex:none;height:auto;border-right:0;border-bottom:1px solid var(--border)}
    .brand{display:flex;align-items:center;justify-content:space-between;padding:14px 16px}
    .brand p{display:none}
    #burger{display:block;background:transparent;border:1px solid var(--border);color:var(--text);
            border-radius:6px;padding:6px 11px;font-size:15px;cursor:pointer}
    nav{display:none;padding:8px}
    nav.open{display:block}
    .side-foot{display:none}
    #main{height:calc(100vh - 60px)}
  }
</style>
</head>
<body>

<aside id="sidebar">
  <div class="brand">
    <div>
      <h1>財務分析儀表板</h1>
      <p>個人收支 ｜ 米鹿私藏</p>
    </div>
    <button id="burger" aria-label="開關選單">☰</button>
  </div>

  <nav id="nav">
    <div class="nav-label">儀表板</div>

    <button class="nav-item active"
            data-src="收支分析儀表板_v3.html"
            data-name="收支分析儀表板 v3">
      收支分析儀表板
      <small>個人收支趨勢 ｜ 資料至 2026/07/20</small>
    </button>

    <button class="nav-item" data-theme="purple"
            data-src="米鹿私藏_投資效益分析_v4.html"
            data-name="米鹿私藏 投資效益分析 v4">
      米鹿私藏 投資效益分析
      <small>蝦皮小店損益 ｜ 資料至 2026/07/21</small>
    </button>
  </nav>

  <div class="side-foot">
    資料來源：AndroMoney、蝦皮月報表<br>
    <a href="https://github.com/milulee-tw/finance" target="_blank" rel="noopener">GitHub Repository ↗</a>
  </div>
</aside>

<main id="main">
  <div id="topbar">
    <div id="crumb">目前檢視：<b id="crumb-name">收支分析儀表板 v3</b></div>
    <a id="newtab" href="收支分析儀表板_v3.html" target="_blank" rel="noopener">在新分頁開啟 ↗</a>
  </div>
  <iframe id="frame" src="收支分析儀表板_v3.html" title="儀表板內容"></iframe>
</main>

<script>
(function(){
  var items  = document.querySelectorAll('.nav-item');
  var frame  = document.getElementById('frame');
  var crumb  = document.getElementById('crumb-name');
  var newtab = document.getElementById('newtab');
  var nav    = document.getElementById('nav');
  var burger = document.getElementById('burger');

  function show(btn, push){
    var src = btn.dataset.src;
    items.forEach(function(i){ i.classList.remove('active'); });
    btn.classList.add('active');
    // 重設 src 才會讓儀表板的圖表重新以正確寬度繪製
    frame.src      = src;
    newtab.href    = src;
    crumb.textContent = btn.dataset.name;
    document.title = btn.dataset.name + ' ｜ 財務分析儀表板';
    nav.classList.remove('open');
    if (push) history.replaceState(null, '', '#' + encodeURIComponent(src));
  }

  items.forEach(function(btn){
    btn.addEventListener('click', function(){ show(btn, true); });
  });

  burger.addEventListener('click', function(){ nav.classList.toggle('open'); });

  // 支援用 #檔名 直接開到指定儀表板
  var hash = decodeURIComponent(location.hash.slice(1));
  if (hash){
    items.forEach(function(btn){ if (btn.dataset.src === hash) show(btn, false); });
  }
})();
</script>
</body>
</html>
